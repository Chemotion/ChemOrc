# Chemotion ELN v4.0.1
# Draft: the images come from complat/dev and are switched to the release repository before release.
services:
  dbupgrade:
    image: complat/dev:dbupgrade-4.0.1
    volumes:
      - chemotion_db:/var/lib/postgresql/data/
    restart: "no"

  db:
    image: complat/dev:db-4.0.1
    restart: unless-stopped
    # The 10 s default ends in SIGKILL when a large database is still writing its shutdown
    # checkpoint; dbupgrade then skips its maintenance on the next start.
    stop_grace_period: 2m
    hostname: db
    depends_on:
      dbupgrade:
        condition: service_completed_successfully
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - chemotion_db:/var/lib/postgresql/data/
    networks:
      - chemotion

  msconvert:
    image: complat/dev:msconvert-3.0.26121
    restart: unless-stopped
    hostname: msconvert
    volumes:
      - spectra:/shared:rw
    networks:
      - chemotion

  spectra:
    image: complat/dev:spectra-1.6.0
    restart: unless-stopped
    hostname: spectra
    volumes:
      - spectra:/shared:rw
    depends_on:
      - msconvert
    networks:
      - chemotion

  worker:
    image: complat/dev:eln-4.0.1
    restart: unless-stopped
    environment:
      - CONFIG_ROLE=worker
      - SECRET_KEY_BASE=pleasechangeme
      - RUBYOPT=-W0
      - OTP_SECRET_KEY=1pleasechangeme2pleasechangeme3
    depends_on:
      - db
      - eln
      - spectra
    volumes:
      - chemotion_data:/chemotion/data/
      - chemotion:/chemotion/app
    networks:
      - chemotion

  eln:
    image: complat/dev:eln-4.0.1
    restart: unless-stopped
    # The first start after an upgrade migrates the database and compiles the assets before the
    # ELN answers (several minutes on a large instance). Give it 20 minutes before a failing
    # check counts, so the services waiting for eln (ketchersvc) do not fail to start.
    healthcheck:
      start_period: 20m
    environment:
      - CONFIG_ROLE=eln
      - SECRET_KEY_BASE=pleasechangeme
      - RUBYOPT=-W0
      - OTP_SECRET_KEY=1pleasechangeme2pleasechangeme3
      # Origins allowed to drive the self-hosted NMRium wrapper. Defaults to the
      # instance's PUBLIC_URL; set it (here or in shared/pullin/.env) only when the ELN
      # is reached under more than one hostname.
      # - NMRIUM_ALLOWED_ORIGINS=https://eln.example.org https://eln.alias.example.org
    depends_on:
      - db
      - spectra
    volumes:
      - ./shared/pullin:/shared
      - ./shared/backup:/backup
      - chemotion_data:/chemotion/data/
      - chemotion:/chemotion/app
    ports:
      - 4000:4000
    networks:
      - chemotion
      - pdftext

  ketchersvc:
    image: complat/dev:ketchersvc-4.0.1
    restart: unless-stopped
    init: true
    depends_on:
      eln:
        condition: service_healthy
    networks:
      - chemotion

  converter:
    image: complat/dev:converter-1.9.3
    restart: unless-stopped
    environment:
      - SECRET_KEY=imsupersecretandwanttobechanged
    volumes:
      - ./services/converter/profiles:/srv/chemotion/profiles
      - ./services/converter/datasets:/srv/chemotion/datasets
    networks:
      - chemotion

  # Extracts the text of uploaded PDFs (safety data sheets) for the ELN.
  # The PDF travels in the request: no volumes, no secrets, no outside access, bounded resources.
  pdftext:
    image: complat/dev:pdftext-4.0.1
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 64
    networks:
      - pdftext

  indigo_service:
    hostname: indigo_service
    image: epmlsop/indigo-service:1.46.0
    restart: unless-stopped
    environment:
      - PYTHONPATH=/srv/indigo-python
      - INDIGO_UWSGI_RUN_PARAMETERS=--plugin python3 --py-autoreload=1
      - PYTHONDONTWRITEBYTECODE=1
    command: supervisord -n
    networks:
      - chemotion

volumes:
  chemotion:
    name: chemotion_app
  chemotion_data:
    name: chemotion_data
  chemotion_db:
    name: chemotion_db
  spectra:
    name: chemotion_spectra

networks:
  chemotion:
  pdftext:
    internal: true
